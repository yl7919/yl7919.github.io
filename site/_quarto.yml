project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/*.qmd"
    - "explore/*.qmd"
    - "photography/*.qmd"
    - "zh/**/*.qmd"
    - "!research/_*.qmd"
    - "!_includes/*"
    - "!**/_*.qmd"
  resources:
    - data/*.json
    - data/photos/*.json
    - assets/img/**
    - assets/photos/**
    - assets/pdfs/*
    - assets/js/*
  post-render:
    - tools/zh_labels.py
    - tools/strip_appledouble.py

website:
  title: "Mingyang Liu"
  site-url: https://yl7919.github.io
  description: "Mingyang Liu — empirical asset pricing, characteristic-based factor models, portfolio choice. PhD in Finance, Imperial College London."
  navbar:
    left:
      - {text: Research, href: research/index.qmd}
      - {text: CV, href: cv.qmd}
      - {text: Software, href: software.qmd}
      - {text: Photography, href: photography/index.qmd}
    right:
      - {text: "中文", href: /zh/, aria-label: "Switch language"}
  page-footer:
    left: "© 2026 Mingyang Liu"
    right: "Built with Quarto · [Privacy](/privacy.qmd) · Exhibit data are generated from the author's research materials; see each figure's provenance line."
  open-graph: true
  search: false

format:
  html:
    theme: [cosmo, assets/theme.scss]
    page-layout: article
    grid: {body-width: 704px, margin-width: 152px, sidebar-width: 60px, gutter-width: 2rem}
    toc: false
    number-sections: false
    code-copy: false
    html-math-method: katex
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: false
    reference-location: document
    fig-cap-location: bottom
    title-block-style: default
    appendix-style: default
    link-external-newwindow: true
    lightbox: false
    smooth-scroll: true
    anchor-sections: false
    include-in-header:
      - file: assets/analytics.html
    include-after-body:
      - file: assets/after-body.html

filters: [quarto, filters/paperhead.lua, filters/vars-optional.lua, filters/hreflang.lua]
