project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/*.qmd"
    - "zh/**/*.qmd"
    - "!research/_*.qmd"
    - "!_includes/*"
    - "!**/_*.qmd"
  resources:
    - data/*.json
    - data/photos/*.json
    - assets/img/**
    - assets/photos/**
    - assets/pdfs/*
    - assets/js/*
  post-render:
    - tools/zh_labels.py

website:
  title: "Mingyang Liu"
  site-url: https://yl7919.github.io
  description: "Mingyang Liu: empirical asset pricing, characteristic-based factor models, portfolio choice. PhD in Finance, Imperial College London."
  navbar:
    left:
      - text: Research
        menu:
          - text: "Five questions, each with a live example"
          - text: "<span class=\"rq\"><span class=\"n\">1</span> <span class=\"q\">Which ruler?</span> <span class=\"do\">Drag the overlap: the plain ruler lets two blocks sum to 190%</span></span>"
            href: research/geometric-framework.qmd#gf-example
          - text: "<span class=\"rq\"><span class=\"n\">2</span> <span class=\"q\">What does the ruler decide, and how reliable is the answer?</span> <span class=\"do\">Slide the overlap: the split moves, the fit stays put</span></span>"
            href: research/characteristic-space-metrics.qmd#a-simple-example
          - text: "<span class=\"rq\"><span class=\"n\">3</span> <span class=\"q\">What does a smaller alpha mean?</span> <span class=\"do\">Cross two models' estimates and factors: alpha falls from 117 bp to 75</span></span>"
            href: research/interpreting-pricing-errors.qmd#a-simple-example
          - text: "<span class=\"rq\"><span class=\"n\">4</span> <span class=\"q\">Same forecast, different portfolio?</span> <span class=\"do\">Change the ruler's unit: forecast unchanged, stock 1's share swings 20–\u206054%</span></span>"
            href: research/characteristic-geometry.qmd#a-simple-example
          - text: "<span class=\"rq rq-jmp\"><span class=\"n\">5</span> <span class=\"q\">Same information, different holdings? <span class=\"jmp\">Job market paper</span></span> <span class=\"do\">Rewrite the library, add no information: target holdings differ by 19–\u206028%</span></span>"
            href: research/characteristic-libraries.qmd#example
          - "---"
          - text: "All research"
            href: research/index.qmd
      - {text: "Data & Code", href: data-code.qmd}
      - {text: CV, href: cv.qmd}
    right:
      - {text: "中文", href: /zh/, aria-label: "Switch language"}
  page-footer:
    left: "© 2026 Mingyang Liu"
    right: "Built with Quarto · [Privacy](/privacy.qmd) · Campus photographs courtesy of the University of Michigan, Columbia University and Imperial College London."
  open-graph: true
  search: false

format:
  html:
    theme: [cosmo, assets/theme.scss]
    page-layout: article
    grid: {body-width: 704px, margin-width: 152px, sidebar-width: 60px, gutter-width: 2rem}
    toc: false
    number-sections: false
    code-copy: false
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/"
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: false
    reference-location: document
    fig-cap-location: bottom
    title-block-style: default
    appendix-style: default
    link-external-newwindow: true
    lightbox: false
    smooth-scroll: true
    anchor-sections: false
    include-in-header:
      - file: assets/analytics.html
    include-after-body:
      - file: assets/after-body.html

filters: [quarto, filters/paperhead.lua, filters/vars-optional.lua, filters/hreflang.lua]
