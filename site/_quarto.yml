project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/*.qmd"
    - "projects/*.qmd"
    - "zh/**/*.qmd"
    - "research-toolkit/*.qmd"
    - "!research/_*.qmd"
    - "!_includes/*"
    - "!**/_*.qmd"
  resources:
    - CNAME
    - jobmarket/**
    - zh/jobmarket/**
    - data/*.json
    - data/photos/*.json
    - assets/img/**
    - assets/photos/**
    - assets/pdfs/*
    - "assets/pdfs/projects/**"
    - assets/js/*
    - 1df2537c6a8e445e8018b6ce70befe14.txt   # IndexNow key (Bing Webmaster Tools, owner 2026-10-01)
    - robots.txt
    - llms.txt
  post-render:
    - tools/zh_labels.py
    - tools/alias_stubs.py
    - tools/page_titles.py


website:
  title: "Mingyang Liu"
  site-url: https://mingyangliu.org
  description: "Mingyang Liu, quantitative researcher: empirical asset pricing, factor models and machine learning in finance. PhD in Finance, Imperial College London."
  navbar:
    left:
      - text: Research
        menu:
          - text: "Papers, each with an interactive example"
          - text: "<span class=\"rq rq-paper rq-jmp\"><span class=\"q\">The Ruler Matters <span class=\"jmp\">Job market paper</span></span><span class=\"visually-hidden\">:</span> <span class=\"do\">Same target, different stocks? Hedge with the plain ruler: 46.10% of the position stays on the loadings</span></span>"
            href: research/the-ruler-matters.qmd#example
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">A Geometric Framework for Identification</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Which ruler? Drag the overlap: the plain ruler lets two blocks sum to 190%</span></span>"
            href: research/geometric-framework.qmd#gf-example
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">Characteristic-Space Metrics</span><span class=\"visually-hidden\">:</span> <span class=\"do\">What does the ruler decide, and how reliable is the answer? Slide the overlap: the split moves, the fit stays put</span></span>"
            href: research/characteristic-space-metrics.qmd#a-simple-example
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">Interpreting Estimated Pricing Errors</span><span class=\"visually-hidden\">:</span> <span class=\"do\">What does a smaller alpha mean? Cross two models' estimates and factors: alpha falls from 117 bp to 75</span></span>"
            href: research/interpreting-pricing-errors.qmd#a-simple-example
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">Same Forecasts, Different Portfolios</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Change the ruler's unit: forecast unchanged, stock 1's share swings 20–⁠54%</span></span>"
            href: research/same-forecasts-different-portfolios.qmd#a-simple-example
          - "---"
          - text: "Research in progress"
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">Exposure or Intercept? Corporate Bond Premia</span><span class=\"visually-hidden\">:</span> <span class=\"do\">With Paolo Zaffaroni · in preparation</span></span>"
            href: research/index.qmd#bond-premia
          - text: "<span class=\"rq rq-paper\"><span class=\"q\">Portfolio construction from linear forecasts</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Research collaboration with Prof. Semyon Malamud (EPFL)</span></span>"
            href: research/index.qmd#linear-forecasts
          - "---"
          - text: "All research"
            href: research/index.qmd
      # Research Toolkit: one top-level menu between Research and Projects, with short functional labels and one
      # plain line each; a visually hidden ":" separates the two for screen readers. The tool pages keep their URLs.
      # Under each tool, a second item (class rq-demo) jumps straight to its "Interactive demonstration" section
      # (owner request 2026-10-13); the ▶ glyph is CSS, so the text stays the accessible name.
      # ZH text and hrefs come from tools/zh_labels.py (TOOLKIT_ITEMS); keep the two in step.
      - text: Research Toolkit
        menu:
          - text: "<span class=\"rq rq-tool\"><span class=\"q\">Portfolio Risk Diagnostics</span><span class=\"visually-hidden\">:</span> <span class=\"do\">How returns behaved across market conditions</span></span>"
            href: projects/return-state-diagnostics.qmd
          - text: "<span class=\"rq rq-tool rq-demo\"><span class=\"q\">Interactive demonstration</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Open the interactive demonstration</span></span>"
            href: projects/return-state-diagnostics.qmd#demo
          - text: "<span class=\"rq rq-tool\"><span class=\"q\">Macro Forecast Evaluation</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Compare forecast models on consistent samples</span></span>"
            href: projects/forecast-evaluation.qmd
          - text: "<span class=\"rq rq-tool rq-demo\"><span class=\"q\">Interactive demonstration</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Open the interactive demonstration</span></span>"
            href: projects/forecast-evaluation.qmd#demo
          - "---"
          - text: "Toolkit Overview"
            href: research-toolkit/index.qmd
      # Projects: a menu like Research (owner request 2026-10-13): a header line, the three areas of the Projects
      # page with the one-line lead of each section (same span structure as the Toolkit items, class rq-area), a
      # divider and "All projects". ZH text and hrefs come from tools/zh_labels.py (PROJECTS_ITEMS, PROJECTS_HEADERS);
      # the Projects toggle is marked current by tools/zh_labels.py and assets/js/nav-active.js (URL prefix /projects/).
      - text: Projects
        menu:
          - text: "Three areas, each with its projects"
          - text: "<span class=\"rq rq-area\"><span class=\"q\">Machine learning and portfolios</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Factor-model forecasts, rolling U.S. backtests and controlled comparisons, followed to holdings, risk and costs</span></span>"
            href: projects/index.qmd#machine-learning-and-portfolios
          - text: "<span class=\"rq rq-area\"><span class=\"q\">Estimation tools</span><span class=\"visually-hidden\">:</span> <span class=\"do\">Code that other people can rerun and audit</span></span>"
            href: projects/index.qmd#estimation-tools
          - text: "<span class=\"rq rq-area\"><span class=\"q\">Text and AI</span><span class=\"visually-hidden\">:</span> <span class=\"do\">A text-signal research plan, and a workflow in which AI coding assistants work under human review</span></span>"
            href: projects/index.qmd#text-and-ai
          - "---"
          - text: "All projects"
            href: projects/index.qmd
      - {text: "Data & Code", href: data-code.qmd}
      - {text: CV, href: cv.qmd}
    right:
      # The visible endonym is the accessible name; tools/zh_labels.py adds lang and hreflang.
      - {text: "中文", href: /zh/}
  page-footer:
    left: '© 2026 Mingyang Liu · [Independent advisory](/advisory.qmd) · [Photography (Pexels)](https://www.pexels.com/@Mingyang-LIU-301813241){target="_blank" rel="noopener"}'
    right: "Built with Quarto · [Privacy](/privacy.qmd) · Campus photographs courtesy of the University of Michigan, Columbia University and Imperial College London."
  open-graph:
    image: /assets/img/og-card.png
    image-alt: "Mingyang Liu (刘明杨), PhD in Finance, Imperial College London"
  twitter-card:
    image: /assets/img/og-card.png
    card-style: summary_large_image
  search: false

format:
  html:
    theme: [cosmo, assets/theme.scss]
    page-layout: article
    grid: {body-width: 704px, margin-width: 152px, sidebar-width: 60px, gutter-width: 2rem}
    toc: false
    number-sections: false
    code-copy: false
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/"
    citations-hover: true
    footnotes-hover: true
    crossrefs-hover: false
    reference-location: document
    fig-cap-location: bottom
    title-block-style: default
    appendix-style: default
    link-external-newwindow: true
    lightbox: false
    smooth-scroll: true
    anchor-sections: false
    include-in-header:
      - file: assets/analytics.html
    include-after-body:
      - file: assets/after-body.html

filters: [quarto, filters/paperhead.lua, filters/vars-optional.lua, filters/hreflang.lua, filters/jsonld.lua]
