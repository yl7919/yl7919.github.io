name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read   # the IndexNow step polls the Pages build API

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Submit URLs to IndexNow (Bing and partners)
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time, urllib.request, urllib.error
          KEY = "1df2537c6a8e445e8018b6ce70befe14"
          HOST = "mingyangliu.org"
          key_url = f"https://{HOST}/{KEY}.txt"
          # 1. Wait until GitHub Pages has built the gh-pages commit that the publish step just pushed
          #    (the key file alone cannot tell a new deploy from the previous one). Up to ~8 min.
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          try:
              want = subprocess.run(["git", "ls-remote", "origin", "refs/heads/gh-pages"], capture_output=True,
                                    text=True, check=True).stdout.split()[0]
          except Exception as e:
              want = ""; print(f"IndexNow: cannot read the gh-pages commit ({e}); falling back to the key-file check")
          built = False
          for _ in range(32):
              if not (repo and token and want):
                  break
              try:
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pages/builds/latest",
                                               headers={"Authorization": f"Bearer {token}",
                                                        "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      b = json.load(r)
                  if b.get("status") == "built" and b.get("commit") == want:
                      built = True; break
                  if b.get("status") == "errored":
                      print("IndexNow: Pages build errored; skipping this run"); raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"IndexNow: Pages API not available ({e}); falling back to the key-file check"); break
              time.sleep(15)
          if built:
              time.sleep(60)   # one CDN cache TTL (max-age=600 would be safer, but crawls are not immediate)
          # 2. The key file must be served (sanity check; up to ~4 min).
          for _ in range(16):
              try:
                  with urllib.request.urlopen(key_url, timeout=20) as r:
                      if r.read().decode().strip() == KEY:
                          break
              except Exception:
                  pass
              time.sleep(15)
          else:
              print("IndexNow: key file not live yet; skipping this run"); raise SystemExit(0)
          print(f"IndexNow: Pages build {'confirmed' if built else 'not confirmed'} for {want[:7] or '?'}")
          xml = open("site/_site/sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>(.*?)</loc>", xml)
          body = {"host": HOST, "key": KEY, "keyLocation": key_url, "urlList": urls[:10000]}
          req = urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps(body).encode("utf-8"),
                                       headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow: HTTP {r.status} for {len(urls)} URLs")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: HTTP {e.code} {e.read()[:300]!r}")
          PY
