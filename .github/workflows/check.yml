name: Check site

# Renders the site and runs the site checks on every pull request and on pushes to main and restyle.
# The Python data pipeline never runs here (D19): derived JSON/PNG are committed and CI never reads
# the external volume. publish.yml is separate and unchanged.

on:
  pull_request:
  push:
    branches: [main, restyle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_translations.py compares translated-from with git history
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: |
          python -m pip install pyyaml==6.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils   # pdftotext for check_links.py rule (h)
      - name: Render site
        run: quarto render site
      - name: Check links and rules (a)-(k)
        run: python site/tools/check_links.py
      - name: Check translation staleness (warnings only)
        run: python site/tools/check_translations.py
