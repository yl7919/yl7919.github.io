# Copy to sources.toml (gitignored) and set absolute paths on your machine.
# geometry_release is required; the other roots are needed only by the exhibits that use them.
[roots]
geometry_release = "/absolute/path/to/Characteristic_Geometry_and_Portfolio_Choice_Research_Release_2026-09-09"
jmp_results = "/absolute/path/to/Codex project_JobMarket/04_results/r3"
csm_presentation = "/absolute/path/to/extracted/Characteristic_Space_Metrics_Presentation"
geometric_framework = "/absolute/path/to/extracted/A_Geometric_Framework_for_Identification"
pricing_errors = "/absolute/path/to/extracted/Interpreting_Estimated_Pricing_Errors_Overleaf"
dynamic_geometry = "/absolute/path/to/the/dynamic-geometry/tables"
# The two October 2026 papers: The Ruler Matters (folder with tables/*.csv and evidence/*.csv) and
# Same Forecasts, Different Portfolios (experiment outputs; folder holding Replication_Package.zip).
ruler_matters = "/absolute/path/to/the_ruler_matters/source"
same_forecasts = "/absolute/path/to/same_forecasts/experiment/outputs"
same_forecasts_package = "/absolute/path/to/same_forecasts/package/folder"

# Only for the forecast-evaluation exhibit: the archive's folder and file names, kept out of tracked code.
[uk_inflation_layout]
summary_dir = "<folder of the research-summary run>"
latest_dir = "<folder of the latest run>"
t06 = "tables/<model ladder table>_{tag}.csv"
t08 = "tables/<pairwise summary table>_{tag}.csv"
t09 = "tables/<per-origin forecasts table>_{tag}.csv"
t10 = "tables/<common-sample ladder table>_{tag}.csv"
panel = "data/processed/<monthly panel>.csv"
state = "data/processed/<state-space estimates>.csv"
rolling = "data/processed/<rolling estimates>.csv"
